<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ポスティング管理</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="/style.css">
</head>
<body class="map-page">
<header id="header">
  <div class="header-row header-row-controls">
    <select id="term-select"></select>
    <span id="view-only-badge">閲覧専用</span>
    <select id="assignee-filter"></select>
    <div class="header-actions">
      <button id="gps-button" type="button" title="現在地">📍</button>
      <button id="menu-button" type="button" title="メニュー">&#8801;</button>
    </div>
  </div>
  <div class="header-row header-row-stats" id="header-stats">
    <span>全世帯数: <strong id="stat-total-households">0</strong></span>
    <span>実績/予定枚数:
      <strong id="stat-distributed">0</strong>(<span id="stat-distributed-rate">0.0%</span>) /
      <strong id="stat-planned-households">0</strong>(<span id="stat-planned-rate">0.0%</span>)
    </span>
  </div>
  <div class="header-toggle-hint" aria-hidden="true"></div>
  <div id="menu-panel">
    <button id="new-term-button" type="button" style="display:none;">新ターム開始</button>
    <a href="/history.html" class="menu-link">履歴一覧</a>
    <a href="/areas.html" class="menu-link">地域マスタ一覧</a>
    <a href="/users.html" id="users-link" class="menu-link" style="display:none;">ユーザー管理</a>
    <a href="/data-clear.html" id="data-clear-link" class="menu-link" style="display:none;">データクリア</a>
    <button id="logout-button" type="button">ログアウト</button>
  </div>
</header>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/config.js"></script>
<script src="/app.js"></script>
</body>
</html>
