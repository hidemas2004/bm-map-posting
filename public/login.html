<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ポスティング管理 ログイン</title>
<style>
  body { font-family: ui-sans-serif, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
         background: #0f1420; color: #e7ecf5; display: flex; align-items: center; justify-content: center;
         height: 100vh; margin: 0; }
  form { display: flex; flex-direction: column; gap: 12px; padding: 32px; background: #161d2c;
         border: 1px solid #2a344a; border-radius: 12px; width: min(320px, 90vw); }
  h1 { font-size: 16px; margin: 0 0 4px; }
  select, input { padding: 10px 12px; border-radius: 8px; border: 1px solid #2a344a; background: #0f1420;
          color: #e7ecf5; font-size: 14px; }
  button { padding: 10px 12px; border-radius: 8px; border: none; background: #3b82f6; color: #ffffff;
           font-weight: 700; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  p.error { color: #f87171; font-size: 13px; margin: 0; min-height: 16px; }
</style>
</head>
<body>
<form id="login-form">
  <h1>ポスティング管理</h1>
  <select id="user-id" required>
    <option value="" disabled selected>ユーザーIDを選択</option>
  </select>
  <input type="password" id="passphrase" placeholder="合言葉" required autocomplete="current-password">
  <button type="submit">ログイン</button>
  <p class="error" id="error-message"></p>
</form>
<script src="/login.js"></script>
</body>
</html>
