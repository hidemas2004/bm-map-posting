<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ポスティング管理 投票所管理</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="list-page">
<header id="header">
  <div class="header-row">
    <h1>投票所管理</h1>
    <div class="header-actions">
      <a href="/" id="back-link">地図に戻る</a>
    </div>
  </div>
</header>
<main class="list-main">
  <div class="list-toolbar">
    <span id="station-count"></span>
  </div>
  <div class="data-table-wrap">
    <table class="data-table">
      <thead>
        <tr><th>名称</th><th>住所</th><th>緯度</th><th>経度</th></tr>
      </thead>
      <tbody id="stations-tbody"></tbody>
    </table>
  </div>

  <section class="import-section">
    <h2>CSVで一括登録</h2>
    <p class="import-hint">
      <code>name, address, lat, lng</code>列を持つCSVをアップロードしてください
      （<code>name</code>, <code>lat</code>, <code>lng</code>は必須、<code>address</code>は空欄可）。
      アップロードすると<strong>現在登録されている投票所は全て、CSVの内容で置き換わります</strong>
      （差分追加ではなく全件洗い替え）。
    </p>
    <input type="file" id="import-file" accept=".csv,text/csv">
    <button id="import-button" type="button">アップロードして反映</button>
    <p class="error" id="import-error"></p>
    <p class="success" id="import-success"></p>
    <p class="warning" id="import-note"></p>
    <ul class="import-warnings" id="import-warnings"></ul>
  </section>
</main>
<script src="/polling-stations.js"></script>
</body>
</html>
